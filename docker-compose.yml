services:
  postgres:
    image: postgres:16-alpine
    container_name: todo-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: todo_app
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_password

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U todo_user -d todo_app"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend

    container_name: todo-backend
    restart: unless-stopped

    environment:
      DB_URL: jdbc:postgresql://postgres:5432/todo_app
      DB_USERNAME: todo_user
      DB_PASSWORD: todo_password
      JWT_SECRET: CW0HadwOXyf5IAFzsR+rGl/Mmv59PvDgfJxerWK56Bw=
      JWT_EXPIRATION: 86400000
      PORT: 8080

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8080/api

    container_name: todo-frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - backend

volumes:
  postgres_data: